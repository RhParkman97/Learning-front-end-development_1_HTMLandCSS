<!-- Creating 3 different styled buttons [seen in the video] -->
<!-- 1. Creating the subscribe button from YouTube  -->
<style>
  .subscribe-button {
    background-color: rgb(210, 0, 0);
    color: white;
    border: none;
    height: 35px;
    width: 105px;
    border-radius: 3px;
    cursor: pointer;
    margin-right: 8px;
  }

  .join-button {
    background-color: white;
    color: rgb(50, 130, 240);
    font-weight: 550;
    height: 35px;
    width: 70px;
    border-color: rgb(50, 130, 240);
    border-style: solid;
    border-width: 1px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
  }

  .tweet-button {
    background-color: rgb(50, 160, 255);
    color: white;
    font-weight: bold;
    font-style: solid;
    height: 35px;
    width: 70px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
  }
  
</style>

<button class="subscribe-button">
  SUBSCRIBE
</button>

<button class="join-button">
  JOIN
</button>

<button class="tweet-button">
  Tweet
</button>
