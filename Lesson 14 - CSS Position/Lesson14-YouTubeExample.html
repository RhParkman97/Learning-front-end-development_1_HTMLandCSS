<!-- 

  YouTube Example (Fixing the header in place!)

-->

<!DOCTYPE html>
<html>
  <head>
    <title>
      Lesson 13 - Nested Flexbox - YouTube Header
    </title>

    <link rel="stylesheet" href="Styles/Lesson14-YouTube-General.css">

    <link rel="stylesheet" href="Styles/Lesson14-YouTube-Header.css">

    <link rel="stylesheet" href="Styles/Lesson14-YouTube-Sidebar.css"
  </head>

  <body style="
  height: 3000px;">
    <div class="header">
      <div class="left-section">
        
        <img class="hamburger-menu" src="../Lesson 13 - Nested Flexbox/icons/hamburger-menu.svg">

        <img class="youtube-logo" src="../Lesson 13 - Nested Flexbox/icons/youtube-logo.svg">
      </div>
        
      <div class="middle-section">
            
        <input type="text" class="search-bar" placeholder="Search">
        
        <button class="search-button">
          <img class="search-button-image" src="../Lesson 13 - Nested Flexbox/icons/search.svg"> 
        </button>

        <button class="voice-search-button">
          <img class="voice-search-button-image" src="../Lesson 13 - Nested Flexbox/icons/voice-search-icon.svg">
        </button>

      </div>  

      <div class="right-section">
        <button class="create-button">
        <img class="create-image" src="../Lesson 13 - Nested Flexbox/icons/create-icon.svg">
      </button>

      <button class="youtube-apps-button">
        <img class="youtube-apps-image" src="../Lesson 13 - Nested Flexbox/icons/youtube-apps.svg">
      </button>

      <button class="notifications-button">
        <img class="notifications-image" src="../Lesson 13 - Nested Flexbox/icons/notifications.svg">
      </button>

      <button class="user-channel-button">
        <img class="user-channel-image" src="../Lesson 13 - Nested Flexbox/icons/my-channel.jpeg">
      </button>
      </div>
    </div>

    <div class="sidebar">
      <img class="sidebar-home-icon" src="../Final Project (YouTube)/youtube_icons/menu_icons/home.svg">

      <img class="sidebar-explore-icon" src="../Final Project (YouTube)/youtube_icons/menu_icons/explore.svg">
    </div>
  </body>
</html>
