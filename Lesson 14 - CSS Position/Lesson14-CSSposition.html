<!--
    CSS Position adds a new dimension to our page!
-->

<!DOCTYPE html>
<html>
  <head>
    <title>
      Lesson 13 - CSS Position
    </title>
      
    <link ref="stylesheet" href="Lesson14-CSSposition.css">
  </head>

  <body style="
  height: 3000px;
  padding-top: 50px;
  padding-left: 50px;">
    <div style="
    background-color: black;
    color: white;
     
    position: fixed;
    top: 0px;
    left: 0px;
    right: 0px;
    height: 50px;">
      header
    </div>

    <div style="
      background-color: lightblue;
      height: 200px;
      width: 200px;
      position: static;">
      div1
    </div>

    <div style="
    background-color: lightpink;
    height: 200px;
    width: 200px;">
      div2
    </div>

    <div style="
    background-color: green;
    color: white;

    position: fixed;
    top: 50px;
    left: 0;
    bottom: 0;

    ">
      sidebar
    </div>
  </body>
</html>
