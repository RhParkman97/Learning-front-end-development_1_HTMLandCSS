<!DOCTYPE html>
<html>
  <head>
    <title>
      Lesson 14 - Exercises2
    </title>

    <link rel="stylesheet" href="Lesson14-ChallangeExercises2.css">
  </head>

  <body>
    <h2>
      14e. Use combination of position fixed (and flexbox) to create cat facebook header
    </h2>

    <div class="header-14e">
      <div class="left-section">
        <img class="cat-profile-picture" src="../../Lesson 9 - The div Element/Cat _ image .png">

        <p class="profile-name">
          Oliver Cat
        </p>
      </div>

      <div class="right-section">
        <button class="add-friend-button">
          Add Friend
        </button>

        <button class="message-button">
          Message
        </button>
      </div>
    </div>

    <h2 class="header-14f">
      14f. Create a double-sidebar from discord
    </h2>

    <div class="whole-sidebar-14f">
      <div class="sidebar1-left">
        <img class="profile-picture" src="../../Lesson 9 - The div Element/Cat _ image .png">

        <img class="profile-picture" src="../../Lesson 9 - The div Element/Cat _ image 2 .png">

        <img class="profile-picture" src="../../Lesson 9 - The div Element/Cat _ image 3 .png">
      </div>
        
      <div class="sidebar2-right">
        <div class="info-top-line">
          <p class="info-message">
            INFO
          </p>

          <img class="plus-button" src="Discord _ + button .png">
        </div>
          

        <p class="sub-message">
          # new-videos
        </p>

        <p class="sub-message">
          # updates
        </p>

        <p class="sub-message">
          # faq
        </p>
      </div>
    </div>
    </body>
