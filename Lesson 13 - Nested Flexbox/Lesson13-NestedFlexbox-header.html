<!DOCTYPE html>
<html>
  <head>
    <title>
      Lesson 13 - Nested Flexbox - YouTube Header
    </title>

    <link rel="stylesheet" href="Lesson13-NestedFlexbox-header.css">
  </head>

  <body>
    <div class="header">
      <div class="left-section">
        
        <img class="hamburger-menu" src="icons/hamburger-menu.svg">

        <img class="youtube-logo" src="icons/youtube-logo.svg">
      </div>
        
      <div class="middle-section">
            
        <input type="text" class="search-bar" placeholder="Search">
        
        <button class="search-button">
          <img class="search-button-image" src="icons/search.svg"> 
        </button>

        <button class="voice-search-button">
          <img class="voice-search-button-image" src="icons/voice-search-icon.svg">
        </button>

      </div>  

      <div class="right-section">
        <button class="create-button">
        <img class="create-image" src="icons/create-icon.svg">
      </button>

      <button class="youtube-apps-button">
        <img class="youtube-apps-image" src="icons/youtube-apps.svg">
      </button>

      <button class="notifications-button">
        <img class="notifications-image" src="icons/notifications.svg">
      </button>

      <button class="user-channel-button">
        <img class="user-channel-image" src="icons/my-channel.jpeg">
      </button>
      </div>
    </div>
  </body>
</html>
