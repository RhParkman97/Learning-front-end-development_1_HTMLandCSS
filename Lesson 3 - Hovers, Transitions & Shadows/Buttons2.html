<!-- 
These are additional effects from HTML Elements (buttons [seen in video])

Hovers - button changes color (usually darker or lighter shade) when cursor is above them!

Transitions - button changes "smoothly" (animation from normal to hover [and then active!])

Shadow -  button has a shadow effect (around the button)

intermediate skills (mentioned in video)

-->

<h2>
    Lesson 3 - Hovers, transitions and Shadows
</h2>

<!-- We are using the buttons from previous lesson! -->

<style>
  .subscribe-button {
    background-color: rgb(210, 0, 0);
    color: white;
    border: none;
    height: 35px;
    width: 105px;
    border-radius: 3px;
    cursor: pointer;
    margin-right: 8px;

    transition: opacity 0.2s;
  }

  .subscribe-button:hover {
    opacity: 0.75;
  }

  .subscribe-button:active {
    opacity: 0.5;
  }

  .join-button {
    background-color: white;
    color: rgb(50, 130, 240);
    font-weight: 550;
    height: 35px;
    width: 70px;
    border-color: rgb(50, 130, 240);
    border-style: solid;
    border-width: 1px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;

    transition: background-color 0.2s, color 0.2s;
  }

  .join-button:hover {
    Background-color: rgb(50, 130, 240);
    color: white;
  }

  .join-button:active {
    opacity: 0.65;
  }

  .tweet-button {
    background-color: rgb(50, 160, 255);
    color: white;
    font-weight: bold;
    font-style: solid;
    height: 35px;
    width: 70px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    
    transition: box-shadow 0.15s;
  }

  .tweet-button:hover {
    box-shadow: 5px 5px 8px rgba(0, 0, 0, 0.15);
  }
  
</style>

<button class="subscribe-button">
  SUBSCRIBE
</button>

<button class="join-button">
  JOIN
</button>

<button class="tweet-button">
  Tweet
</button>

<!-- 3d. Bootstrap -->

<style>
  .bootstrap-left-button {
    background-color: rgb(121, 82, 179);

    Background-color: white;
    color: rgb(108, 117, 125);
    font-weight: bold;
    height: 35px;
    width:  100px;
    border-color: rgb(108, 117, 125);
    border-radius: 4px;
    border-width: thin;

    transition: background-color 0.15s, color 0.15s, border 0.15s;
  }

  .bootstrap-right-button:hover {
    background-color: rgb(108, 117, 125);
    color: white;
    border: none;
  }
</style>
