<!-- 

In previous lessons, we haven't been using the overall HTML structrure!
We've been creating snippets of HTML code. In this lesson, we will
be following the overall HTML structure, by creating <html>, <head>  <body>.

Head - contains metadata (the information about the data) information about the page.
        *Not visible on the page (but can be used by search engines, browsers, etc).

Body - contain all elements that will be visible/ displayed on the page.

-->

<!DOCTYPE html>
<html>
    <head>
      <title>
        First Website
      </title>
    
      
    </head>

    <body>
      <p>
        paragraph of text
      </p>  

      <button>
            Hello
        </button>

    </body>
</html>
