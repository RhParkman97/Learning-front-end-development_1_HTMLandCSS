<!-- 
    Nested Layout Techniques:

      Vertical layout - items are organised on top/ below each other.

      Horizontal layout - items are organised beside each other (left and right to each other).
        
        Our Youtube snippet (example) we have a vertical layout
         (thumbnail and details), within the details section we 
         have horizontal layout (channel image and video details)
         and finally we have a vertical layout (video title, channel 
         name, views and upload date).

-->

<!-- 
    Visualizing nested layout techniques with goofle drawing
-->

<!--
    Recreating first 3 thumbnail (youtube example) using 
     nested layout technique!
-->

<!DOCTYPE html>
<html>
  <head>
    <title>
      Lesson 10 - YouTube
    </title>

    <link rel="stylesheet" href="Lesson10-NLT.css">
  </head>

  <body>
    <input class="search-bar" type="textbox" placeholder="Search">

    <div class="video-snippet">
      <div class="section1_vertical-layout_thumbnail">
        <img class="thumbnail" src="../Final Project (YouTube)/thumbnails/thumbnail-1.png">
      </div>

      <div class="section2_vertical-layout_details">
        <div class="section3_horizontal-layout_channel-image">
          <img class="channel-image" src="../Final Project (YouTube)/channel_images/channel-1.jpeg">
        </div>

        <div class="section4_horizontal-layout_video-info">
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>
      
          <p class="video-author">
            Marques Brownlee
          </p>

          <p class="video-stats">
            3.4M views &#xb7 6 months ago
          </p>
        </div>
      </div>
    </div>
      
    <div class="video-snippet">
      <div class="section1_vertical-layout_thumbnail">
        <img class="thumbnail" src="../Final Project (YouTube)/thumbnails/thumbnail-2.png">
      </div>

        <div class="section2_vertical-layout_details">
          <div class="section3_horizontal-layout_channel-image">
            <img class="channel-image" src="../Final Project (YouTube)/channel_images/channel-2.jpeg">
          </div>

          <div class="section4_horizontal-layout_video-info">
            <p class="video-title">
              Talking Tech and AI with Google CEO Sundar Pichai!
            </p>
      
            <p class="video-author">
              Markiplier
            </p>

            <p class="video-stats">
              19M views &#xb7 4 years ago
            </p>
          </div>
        </div>
    </div>

    <div class="video-snippet">
      <div class="section1_vertical-layout_thumbnail">
        <img class="thumbnail" src="../Final Project (YouTube)/thumbnails/thumbnail-3.png">
      </div>

        <div class="section2_vertical-layout_details">
          <div class="section3_horizontal-layout_channel-image">
            <img class="channel-image" src="../Final Project (YouTube)/channel_images/channel-3.jpeg">
          </div>

          <div class="section4_horizontal-layout_video-info">
            <p class="video-title">
              Crazy Tik Toks Taken Moments Before DISASTER
            </p>
      
            <p class="video-author">
              SSSniperWolf
            </p>

            <p class="video-stats">
              12M views &#xb7 1 years ago
            </p>
          </div>
        </div>
    </div>

  </body>
</html>
