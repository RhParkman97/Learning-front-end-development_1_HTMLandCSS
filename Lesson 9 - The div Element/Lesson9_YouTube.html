<!DOCTYPE html>
<html>
  <head>

<Title>
  Lesson 9 - YouTube Clone
</Title>

<style>
  .thumbnail { 
    display: block;
    
    width: 300px;
    height: 200px;

    object-fit: cover;         
  }

  .search-bar {
    display: block;
    
    margin-bottom: 20px;
    

    font-size: 20px;
  }

  .video-preview {
    width: 300px;

    margin-left: 15px;
    
    display: inline-block;
    vertical-align: top;
  }
</style>

  </head>

  <body>
        
    <input class="search-bar" type="textbox" placeholder="Search">
    
    
    <div class="video-preview">
        <img class="thumbnail" src="../Final Project (YouTube)/thumbnails/thumbnail-1.png">
    
      <p>
        Talking Tech and AI with Google CEO Sundar Pichai!
      </p>
      
      <p>
        Marques Brownlee
      </p>

      <p>
        3.4M views &#xb7 6 months ago
      </p>

    <!--
      <paragraph> are block elements (take up the entire line),
      however, if paragraph is within <division> then the block
      element takes up the line within the division.
    -->
    </div>
      
    <div class="video-preview">
        <img class="thumbnail" src="../Final Project (YouTube)/thumbnails/thumbnail-2.png">
    
      <p>
        Try Not To Laugh Challenge #9
      </p>
      
      <p>
        Markiplier
      </p>

      <p>
        19M views &#xb7 4 years ago
      </p>
    <div class=""video-preview">
      
    </div>

  </body>
</html>
